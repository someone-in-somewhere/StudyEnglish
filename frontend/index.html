                            <p class="text-sm text-gray-500 mt-2">
                                <i class="fas fa-arrow-right mr-1"></i>Copy prompt này và paste vào ChatGPT, Claude hoặc AI khác để bắt đầu luyện hội thoại
                            </p>

                            <!-- Save Score Section -->
                            <div class="mt-4 pt-4 border-t">
                                <h4 class="text-sm font-semibold mb-3">Sau khi học xong, nhập điểm để lưu lịch sử:</h4>
                                <div class="flex items-center gap-4">
                                    <div class="flex items-center gap-2">
                                        <label class="text-sm text-gray-600">Điểm (0-10):</label>
                                        <input type="number" x-model="chatScore" min="0" max="10" step="0.1"
                                               class="w-20 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                               placeholder="8.5">
                                    </div>
                                    <button @click="saveConversationHistory"
                                            :disabled="!chatScore"
                                            class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors">
                                        <i class="fas fa-plus mr-1"></i>Thêm vào lịch sử
                                    </button>
                                </div>

                                <!-- JSON Vocabulary Input -->
                                <div class="mt-3">
                                    <label class="text-sm text-gray-600 block mb-2">
                                        <i class="fas fa-book mr-1"></i>Từ vựng mới (paste JSON từ AI):
                                    </label>
                                    <textarea x-model="vocabJson"
                                              class="w-full h-32 px-3 py-2 border rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-accent"
                                              placeholder='[{"word": "example", "meaning_vi": "ví dụ", "part_of_speech": "noun", "example": "This is an example."}]'></textarea>
                                    <div class="flex items-center gap-2 mt-2">
                                        <button @click="parseAndSaveVocab"
                                                :disabled="!vocabJson"
                                                class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors text-sm">
                                            <i class="fas fa-save mr-1"></i>Lưu từ vựng mới
                                        </button>
                                        <span x-show="vocabSaveResult" x-text="vocabSaveResult"
                                              class="text-sm" :class="vocabSaveSuccess ? 'text-green-600' : 'text-red-600'"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Topic Statistics Table -->
                        <div class="mt-6 bg-white rounded-xl shadow p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-lg font-semibold">
                                    <i class="fas fa-chart-bar mr-2 text-indigo-500"></i>
                                    Thống Kê Theo Chủ Đề
                                </h3>
                                <button @click="showTopicStats = !showTopicStats" class="text-sm text-primary hover:underline">
                                    <span x-text="showTopicStats ? 'Ẩn thống kê' : 'Xem thống kê'"></span>
                                    <i class="fas ml-1" :class="showTopicStats ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                                </button>
                            </div>

                            <div x-show="showTopicStats" x-collapse>
                                <!-- Loading -->
                                <div x-show="topicStatsLoading" class="text-center py-8">
                                    <div class="loading-spinner mx-auto mb-2"></div>
                                    <p class="text-gray-500">Đang tải...</p>
                                </div>

                                <!-- Empty -->
                                <div x-show="!topicStatsLoading && topicStats.length === 0" class="text-center py-8 text-gray-500">
                                    <i class="fas fa-chart-pie text-4xl mb-2"></i>
                                    <p>Chưa có dữ liệu thống kê</p>
                                </div>

                                <!-- Summary (Top) -->
                                <div x-show="!topicStatsLoading && topicStats.length > 0" class="mb-4 pb-4 border-b grid grid-cols-2 md:grid-cols-5 gap-4 text-center">
                                    <div class="bg-gray-50 rounded-lg p-3">
                                        <p class="text-2xl font-bold text-primary" x-text="topicStats.length"></p>
                                        <p class="text-xs text-gray-500">Chủ đề đã học</p>
                                    </div>
                                    <div class="bg-gray-50 rounded-lg p-3">
                                        <p class="text-2xl font-bold text-blue-600" x-text="topicStats.reduce((sum, s) => sum + s.total_sessions, 0)"></p>
                                        <p class="text-xs text-gray-500">Tổng buổi học</p>
                                    </div>
                                    <div class="bg-gray-50 rounded-lg p-3">
                                        <p class="text-2xl font-bold text-green-600"
                                           x-text="(topicStats.reduce((sum, s) => sum + s.avg_score * s.total_sessions, 0) / topicStats.reduce((sum, s) => sum + s.total_sessions, 0) || 0).toFixed(1)"></p>
                                        <p class="text-xs text-gray-500">Điểm TB gốc</p>
                                    </div>
                                    <div class="bg-gray-50 rounded-lg p-3">
                                        <p class="text-2xl font-bold text-indigo-600"
                                           x-text="(topicStats.reduce((sum, s) => sum + s.avg_weighted_score * s.total_sessions, 0) / topicStats.reduce((sum, s) => sum + s.total_sessions, 0) || 0).toFixed(1)"></p>
                                        <p class="text-xs text-gray-500">Điểm TB trọng số</p>
                                    </div>
                                    <div class="bg-gray-50 rounded-lg p-3">
                                        <p class="text-2xl font-bold text-purple-600" x-text="Math.max(...topicStats.map(s => s.best_weighted_score))"></p>
                                        <p class="text-xs text-gray-500">Điểm cao nhất</p>
                                    </div>
                                </div>

                                <!-- Stats Table -->
                                <div x-show="!topicStatsLoading && topicStats.length > 0" class="overflow-x-auto">
                                    <table class="w-full text-sm">
                                        <thead>
                                            <tr class="bg-gray-50">
                                                <th class="px-3 py-3 text-left font-medium text-gray-600">Chủ đề</th>
                                                <th class="px-2 py-3 text-center font-medium text-gray-600">Số lần</th>
                                                <th class="px-2 py-3 text-center font-medium text-gray-600">Độ khó</th>
                                                <th class="px-2 py-3 text-center font-medium text-gray-600">Điểm TB</th>
                                                <th class="px-2 py-3 text-center font-medium text-gray-600" title="Điểm có trọng số theo độ khó">Điểm TĐ</th>
                                                <th class="px-2 py-3 text-center font-medium text-gray-600">Cao nhất</th>
                                                <th class="px-2 py-3 text-left font-medium text-gray-600">Phong cách đã học</th>
                                                <th class="px-2 py-3 text-left font-medium text-gray-600">Lần cuối</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="stat in topicStats" :key="stat.topic">
                                                <tr class="border-t hover:bg-gray-50">
                                                    <td class="px-3 py-3 font-medium" x-text="stat.topic"></td>
                                                    <td class="px-2 py-3 text-center">
                                                        <span class="px-2 py-1 bg-blue-100 text-blue-700 rounded" x-text="stat.total_sessions"></span>
                                                    </td>
                                                    <td class="px-2 py-3 text-center">
                                                        <span class="px-2 py-1 rounded text-xs font-medium"
                                                              :class="getDifficultyColor(stat.avg_difficulty)"
                                                              x-text="stat.difficulty_label"></span>
                                                    </td>
                                                    <td class="px-2 py-3 text-center">
                                                        <span class="px-2 py-1 rounded font-semibold"
                                                              :class="getScoreColor(stat.avg_score)"
                                                              x-text="stat.avg_score"></span>
                                                    </td>
                                                    <td class="px-2 py-3 text-center" title="Điểm có trọng số">
                                                        <span class="px-2 py-1 rounded font-bold bg-indigo-100 text-indigo-700"
                                                              x-text="stat.avg_weighted_score"></span>
                                                    </td>
                                                    <td class="px-2 py-3 text-center">
                                                        <span class="text-green-600 font-medium" x-text="stat.best_weighted_score"></span>
                                                    </td>
                                                    <td class="px-2 py-3 text-xs text-gray-600" x-text="getStylesList(stat.styles)"></td>
                                                    <td class="px-2 py-3 text-gray-500 text-xs" x-text="formatStatDate(stat.last_practiced)"></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Conversation History Table -->
                        <div class="mt-6 bg-white rounded-xl shadow p-6">
                            <h3 class="text-lg font-semibold mb-4">
                                <i class="fas fa-history mr-2 text-gray-600"></i>
                                Lịch sử luyện hội thoại
                            </h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead>
                                        <tr class="bg-gray-50">
                                            <th class="px-4 py-3 text-left font-medium text-gray-600">Ngày</th>
                                            <th class="px-4 py-3 text-left font-medium text-gray-600">Chủ đề</th>
                                            <th class="px-4 py-3 text-left font-medium text-gray-600">Độ khó</th>
                                            <th class="px-4 py-3 text-left font-medium text-gray-600">Phong cách</th>
                                            <th class="px-4 py-3 text-left font-medium text-gray-600">Độ dài</th>
                                            <th class="px-4 py-3 text-center font-medium text-gray-600">Điểm</th>
                                            <th class="px-4 py-3 text-center font-medium text-gray-600">Xóa</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="(item, index) in conversationHistory" :key="index">
                                            <tr class="border-t hover:bg-gray-50">
                                                <td class="px-4 py-3" x-text="formatDate(item.date)"></td>
                                                <td class="px-4 py-3" x-text="item.topic"></td>
                                                <td class="px-4 py-3">
                                                    <span class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs" x-text="item.level"></span>
                                                </td>
                                                <td class="px-4 py-3" x-text="item.style"></td>
                                                <td class="px-4 py-3" x-text="item.length"></td>
                                                <td class="px-4 py-3 text-center">
                                                    <span class="px-2 py-1 rounded font-medium"
                                                          :class="item.score >= 8 ? 'bg-green-100 text-green-700' : item.score >= 6 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'"
                                                          x-text="item.score"></span>
                                                </td>
                                                <td class="px-4 py-3 text-center">
                                                    <button @click="deleteConversationHistory(index)" class="text-red-500 hover:text-red-700">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        </template>
                                        <tr x-show="conversationHistory.length === 0">
                                            <td colspan="7" class="px-4 py-8 text-center text-gray-400">
                                                Chưa có lịch sử luyện hội thoại
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- SRS Review Page -->
            <div x-show="currentPage === 'srs'" x-cloak class="slide-enter">
                <template x-if="currentPage === 'srs'">
                    <div x-data="srsPage" x-init="init()">
                        <!-- Stats -->
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                            <div class="bg-white rounded-xl shadow p-4 text-center">
                                <p class="text-3xl font-bold text-primary" x-text="srsStats.dueNow"></p>
                                <p class="text-sm text-gray-500">Due Now</p>
                            </div>
                            <div class="bg-white rounded-xl shadow p-4 text-center">
                                <p class="text-3xl font-bold text-secondary" x-text="srsStats.dueToday"></p>
                                <p class="text-sm text-gray-500">Due Today</p>
                            </div>
                            <div class="bg-white rounded-xl shadow p-4 text-center">
                                <p class="text-3xl font-bold text-accent" x-text="srsStats.totalInSRS"></p>
                                <p class="text-sm text-gray-500">In Review</p>
                            </div>
                            <div class="bg-white rounded-xl shadow p-4 text-center">
                                <p class="text-3xl font-bold text-orange-500" x-text="srsStats.successRate + '%'"></p>
                                <p class="text-sm text-gray-500">Success Rate</p>
                            </div>
                        </div>

                        <!-- Review Session -->
                        <div x-show="!reviewActive && dueReviews.length > 0" class="bg-white rounded-xl shadow p-6 text-center">
                            <i class="fas fa-redo text-6xl text-primary mb-4"></i>
                            <h3 class="text-2xl font-bold mb-2">Ready to Review?</h3>
                            <p class="text-gray-600 mb-6">You have <span class="font-bold text-primary" x-text="dueReviews.length"></span> words due for review</p>
                            <button @click="startReview" class="px-6 py-3 bg-primary text-white rounded-lg hover:bg-blue-600">
                                <i class="fas fa-play mr-2"></i>Start Review
                            </button>
                        </div>

                        <!-- No Reviews Due -->
                        <div x-show="!reviewActive && dueReviews.length === 0" class="bg-white rounded-xl shadow p-6 text-center">
                            <i class="fas fa-check-circle text-6xl text-secondary mb-4"></i>
                            <h3 class="text-2xl font-bold mb-2">All Caught Up!</h3>
                            <p class="text-gray-600">No words due for review. Learn some new words!</p>
                        </div>

                        <!-- Active Review -->
                        <div x-show="reviewActive" class="bg-white rounded-xl shadow p-6">
                            <div class="text-center mb-6">
                                <span class="text-sm text-gray-500">Review <span x-text="currentReviewIndex + 1"></span> of <span x-text="dueReviews.length"></span></span>
                            </div>

                            <div x-show="currentReview" class="text-center mb-8">
                                <h3 class="text-4xl font-bold text-primary mb-2" x-text="currentReview?.word"></h3>
                                <p class="text-gray-500" x-text="currentReview?.pronunciation"></p>
                                <button @click="speakWord(currentReview?.word)" class="mt-2 text-gray-400 hover:text-primary">
                                    <i class="fas fa-volume-up text-2xl"></i>
                                </button>
                            </div>

                            <div x-show="showAnswer" class="text-center mb-8 p-6 bg-gray-50 rounded-lg">
                                <p class="text-2xl text-gray-800" x-text="currentReview?.meaning_vi"></p>
                                <p class="text-gray-600 mt-2 italic" x-text="currentReview?.example_en"></p>
                            </div>

                            <div x-show="!showAnswer" class="text-center">
                                <button @click="showAnswer = true" class="px-8 py-3 bg-primary text-white rounded-lg hover:bg-blue-600">
                                    Show Answer
                                </button>
                            </div>

                            <div x-show="showAnswer" class="grid grid-cols-4 gap-4">
                                <button @click="submitReview(1)" class="p-4 bg-red-500 text-white rounded-lg hover:bg-red-600">
                                    <i class="fas fa-times mb-1"></i>
                                    <p class="text-sm">Again</p>
                                </button>
                                <button @click="submitReview(2)" class="p-4 bg-orange-500 text-white rounded-lg hover:bg-orange-600">
                                    <i class="fas fa-frown mb-1"></i>
                                    <p class="text-sm">Hard</p>
                                </button>
                                <button @click="submitReview(3)" class="p-4 bg-green-500 text-white rounded-lg hover:bg-green-600">
                                    <i class="fas fa-smile mb-1"></i>
                                    <p class="text-sm">Good</p>
                                </button>
                                <button @click="submitReview(4)" class="p-4 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                                    <i class="fas fa-grin-stars mb-1"></i>
                                    <p class="text-sm">Easy</p>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Chat Page -->
            <div x-show="currentPage === 'chat'" x-cloak class="slide-enter">
                <template x-if="currentPage === 'chat'">
                    <div x-data="chatPage" x-init="init()">
                        <div class="bg-white rounded-xl shadow h-[calc(100vh-200px)] flex flex-col">
                            <!-- Chat Header -->
                            <div class="p-4 border-b flex items-center justify-between">
                                <div class="flex items-center">
                                    <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white">
                                        <i class="fas fa-robot"></i>
                                    </div>
                                    <div class="ml-3">
                                        <h3 class="font-semibold">English Tutor</h3>
                                        <p class="text-xs text-gray-500">AI-powered conversation practice</p>
                                    </div>
                                </div>
                                <button @click="clearChat" class="text-gray-400 hover:text-red-500">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>

                            <!-- Chat Messages -->
                            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="chatMessages">
                                <template x-for="msg in messages" :key="msg.id">
                                    <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                                        <div :class="msg.role === 'user' ? 'bg-primary text-white' : 'bg-gray-100 text-gray-800'"
                                             class="max-w-[80%] rounded-lg p-4">
                                            <p x-text="msg.message"></p>
                                            <div x-show="msg.corrections && msg.corrections.length > 0" class="mt-2 pt-2 border-t border-gray-300">
                                                <p class="text-xs font-semibold mb-1">Corrections:</p>
                                                <template x-for="c in msg.corrections" :key="c.original">
                                                    <p class="text-xs"><s x-text="c.original"></s> → <span class="font-medium" x-text="c.corrected"></span></p>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <div x-show="loading" class="flex justify-start">
                                    <div class="bg-gray-100 rounded-lg p-4">
                                        <div class="loading-spinner"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Chat Input -->
                            <div class="p-4 border-t">
                                <div class="flex space-x-4">
                                    <input type="text"
                                           x-model="inputMessage"
                                           @keyup.enter="sendMessage"
                                           placeholder="Type your message..."
                                           class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                                    <button @click="sendMessage"
                                            :disabled="loading || !inputMessage.trim()"
                                            class="px-6 py-3 bg-primary text-white rounded-lg hover:bg-blue-600 disabled:bg-gray-400">
                                        <i class="fas fa-paper-plane"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Export/Import Page -->
            <div x-show="currentPage === 'export'" x-cloak class="slide-enter">
                <template x-if="currentPage === 'export'">
                    <div x-data="exportPage" x-init="init()">
                        <!-- Export Section -->
                        <div class="bg-white rounded-xl shadow p-6 mb-6">
                            <h3 class="text-lg font-semibold mb-4">
                                <i class="fas fa-download mr-2 text-primary"></i>
                                Export Vocabulary
                            </h3>
                            <p class="text-sm text-gray-500 mb-4">
                                Export your learned vocabulary to different formats for backup or use in other apps.
                            </p>

                            <!-- Export Stats -->
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                <div class="p-4 bg-blue-50 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-primary" x-text="exportStats.total_vocabulary"></p>
                                    <p class="text-xs text-gray-600">Total Words</p>
                                </div>
                                <div class="p-4 bg-green-50 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-green-600" x-text="exportStats.learned_vocabulary"></p>
                                    <p class="text-xs text-gray-600">Learned</p>
                                </div>
                                <div class="p-4 bg-purple-50 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-purple-600" x-text="Object.keys(exportStats.by_topic || {}).length"></p>
                                    <p class="text-xs text-gray-600">Topics</p>
                                </div>
                                <div class="p-4 bg-orange-50 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-orange-600" x-text="Object.keys(exportStats.by_level || {}).length"></p>
                                    <p class="text-xs text-gray-600">Levels</p>
                                </div>
                            </div>

                            <!-- Export Options -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                <div>
                                    <label class="flex items-center">
                                        <input type="checkbox" x-model="exportLearnedOnly" class="mr-2">
                                        <span class="text-sm">Only export learned words</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Export Buttons -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <button @click="exportData('json')"
                                        class="flex items-center justify-center p-4 border-2 border-blue-500 text-blue-600 rounded-lg hover:bg-blue-50 transition-colors">
                                    <i class="fas fa-file-code text-2xl mr-3"></i>
                                    <div class="text-left">
                                        <p class="font-semibold">JSON</p>
                                        <p class="text-xs text-gray-500">Full data backup</p>
                                    </div>
                                </button>
                                <button @click="exportData('csv')"
                                        class="flex items-center justify-center p-4 border-2 border-green-500 text-green-600 rounded-lg hover:bg-green-50 transition-colors">
                                    <i class="fas fa-file-csv text-2xl mr-3"></i>
                                    <div class="text-left">
                                        <p class="font-semibold">CSV</p>
                                        <p class="text-xs text-gray-500">Excel compatible</p>
                                    </div>
                                </button>
                                <button @click="exportData('anki')"
                                        class="flex items-center justify-center p-4 border-2 border-purple-500 text-purple-600 rounded-lg hover:bg-purple-50 transition-colors">
                                    <i class="fas fa-clone text-2xl mr-3"></i>
                                    <div class="text-left">
                                        <p class="font-semibold">Anki</p>
                                        <p class="text-xs text-gray-500">Flashcard app</p>
                                    </div>
                                </button>
                            </div>
                        </div>

                        <!-- Import Section -->
                        <div class="bg-white rounded-xl shadow p-6">
                            <h3 class="text-lg font-semibold mb-4">
                                <i class="fas fa-upload mr-2 text-secondary"></i>
                                Import Vocabulary
                            </h3>
                            <p class="text-sm text-gray-500 mb-4">
                                Import vocabulary from JSON or CSV files. Duplicate words will be skipped.
                            </p>

                            <!-- File Upload -->
                            <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-primary transition-colors"
                                 @dragover.prevent="dragOver = true"
                                 @dragleave.prevent="dragOver = false"
                                 @drop.prevent="handleDrop($event)"
                                 :class="{ 'border-primary bg-blue-50': dragOver }">
                                <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-4"></i>
                                <p class="text-gray-600 mb-2">Drag & drop file here or</p>
                                <label class="cursor-pointer">
                                    <span class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-600 transition-colors">

                                        <span class="w-6 h-6 bg-indigo-500 text-white rounded-full flex items-center justify-center text-sm flex-shrink-0">5</span>
                                        <div>
                                            <h4 class="font-medium">Thực hành (15-20 phút)</h4>
                                            <p class="text-sm text-gray-500"><strong>Translation</strong> & <strong>Conversation</strong> để áp dụng thực tế</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Daily Goals -->
                            <div class="bg-white rounded-xl shadow p-6">
                                <h3 class="text-lg font-semibold mb-4">
                                    <i class="fas fa-bullseye mr-2 text-red-500"></i>
                                    Mục Tiêu Hàng Ngày
                                </h3>
                                <div class="space-y-4">
                                    <template x-for="(goal, idx) in dailyGoals" :key="idx">
                                        <div>
                                            <div class="flex justify-between text-sm mb-1">
                                                <span x-text="goal.name"></span>
                                                <span class="text-gray-500" x-text="goal.current + '/' + goal.target"></span>
                                            </div>
                                            <div class="w-full bg-gray-200 rounded-full h-2">
                                                <div class="h-2 rounded-full transition-all"
                                                     :class="goal.color"
                                                     :style="'width: ' + Math.min(100, (goal.current / goal.target) * 100) + '%'"></div>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="mt-6 p-4 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-lg">
                                    <h4 class="font-medium text-indigo-700 mb-2">
                                        <i class="fas fa-star mr-1"></i> Mẹo của chuyên gia
                                    </h4>
                                    <p class="text-sm text-gray-600" x-text="expertTip"></p>
                                </div>
                            </div>
                        </div>

                        <!-- Feature Quick Access -->
                        <div class="bg-white rounded-xl shadow p-6">
                            <h3 class="text-lg font-semibold mb-4">
                                <i class="fas fa-rocket mr-2 text-primary"></i>
                                Truy Cập Nhanh Các Tính Năng
                            </h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
                                <button @click="$dispatch('navigate', 'vocabulary')"
                                        class="p-4 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors text-center">
                                    <i class="fas fa-book text-2xl text-blue-600 mb-2"></i>
                                    <div class="text-sm font-medium">Vocabulary</div>
                                </button>
                                <button @click="$dispatch('navigate', 'flashcards')"
                                        class="p-4 bg-yellow-50 rounded-lg hover:bg-yellow-100 transition-colors text-center">
                                    <i class="fas fa-clone text-2xl text-yellow-600 mb-2"></i>
                                    <div class="text-sm font-medium">Flashcards</div>
                                </button>
                                <button @click="$dispatch('navigate', 'quiz')"
                                        class="p-4 bg-green-50 rounded-lg hover:bg-green-100 transition-colors text-center">
                                    <i class="fas fa-question-circle text-2xl text-green-600 mb-2"></i>
                                    <div class="text-sm font-medium">Quiz</div>
                                </button>
                                <button @click="$dispatch('navigate', 'srs')"
                                        class="p-4 bg-orange-50 rounded-lg hover:bg-orange-100 transition-colors text-center">
                                    <i class="fas fa-redo text-2xl text-orange-600 mb-2"></i>
                                    <div class="text-sm font-medium">Review</div>
                                </button>
                                <button @click="$dispatch('navigate', 'translation')"
                                        class="p-4 bg-purple-50 rounded-lg hover:bg-purple-100 transition-colors text-center">
                                    <i class="fas fa-language text-2xl text-purple-600 mb-2"></i>
                                    <div class="text-sm font-medium">Translation</div>
                                </button>
                                <button @click="$dispatch('navigate', 'conversation')"
                                        class="p-4 bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors text-center">
                                    <i class="fas fa-comments text-2xl text-indigo-600 mb-2"></i>
                                    <div class="text-sm font-medium">Conversation</div>
                                </button>
                                <button @click="$dispatch('navigate', 'analytics')"
                                        class="p-4 bg-pink-50 rounded-lg hover:bg-pink-100 transition-colors text-center">
                                    <i class="fas fa-chart-line text-2xl text-pink-600 mb-2"></i>
                                    <div class="text-sm font-medium">Analytics</div>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav lg:hidden" x-show="true">
        <a href="#" class="bottom-nav-item touch-highlight" :class="{ 'active': currentPage === 'dashboard' }" @click.prevent="navigateTo('dashboard')">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="bottom-nav-item touch-highlight" :class="{ 'active': currentPage === 'vocabulary' }" @click.prevent="navigateTo('vocabulary')">
            <i class="fas fa-book"></i>
            <span>Learn</span>
        </a>
        <a href="#" class="bottom-nav-item touch-highlight" :class="{ 'active': currentPage === 'quiz' }" @click.prevent="navigateTo('quiz')">
            <i class="fas fa-question-circle"></i>
            <span>Quiz</span>
        </a>
        <a href="#" class="bottom-nav-item touch-highlight" :class="{ 'active': currentPage === 'flashcards' }" @click.prevent="navigateTo('flashcards')">
            <i class="fas fa-clone"></i>
            <span>Cards</span>
        </a>
        <a href="#" class="bottom-nav-item touch-highlight" :class="{ 'active': currentPage === 'srs' }" @click.prevent="navigateTo('srs')">
            <i class="fas fa-redo"></i>
            <span>Review</span>
        </a>
    </nav>

    <!-- Toast Notifications -->
    <div class="fixed bottom-20 lg:bottom-4 right-4 z-50 space-y-2">
        <template x-for="toast in toasts" :key="toast.id">
            <div class="px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 slide-enter"
                 :class="toast.type === 'success' ? 'bg-green-500 text-white' : toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-blue-500 text-white'">
                <i :class="toast.type === 'success' ? 'fas fa-check-circle' : toast.type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-info-circle'"></i>
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <!-- Main App Script -->
    <script src="js/app.js"></script>
</body>
</html>
